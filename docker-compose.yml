# Local development and staging rehearsal. Production uses a managed PostgreSQL in an Indian region.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: uday, POSTGRES_PASSWORD: uday, POSTGRES_DB: uday }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: apps/web/.env.local
    environment: { DATABASE_URL: postgres://uday:uday@db:5432/uday }
    ports: ["3000:3000"]
    depends_on: [db]
volumes: { pgdata: {} }
